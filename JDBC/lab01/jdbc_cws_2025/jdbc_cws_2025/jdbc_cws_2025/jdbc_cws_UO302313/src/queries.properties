								   updatedat,version from TPROFESSIONALGROUPS \
								   WHERE id = ?
# TCONTRACTS
TCONTRACTS_FIND_BY_ID = SELECT c.id, c.mechanic_id, c.startdate,\
 								   c.enddate, c.annualbasesalary, c.taxrate, \
 								   c.contracttype_id,c.professionalgroup_id, \
 								   c.settlement, c.version, c.entitystate, \
 								   c.createdat, c.updatedat, c.state FROM \
 								   TCONTRACTS c WHERE c.id = ?


TCONTRACTS_FIND_ACTIVE_AT = SELECT c.id, c.startdate, \
							c.mechanic_id, c.professionalgroup_id, c.state, \
							c.enddate, c.annualbasesalary, c.version, \
							c.entitystate, c.createdat, c.updatedat, \
							c.contracttype_id, c.taxrate, c.settlement FROM \
							TCONTRACTS AS c WHERE c.startdate <= ? AND \
							(c.enddate IS NULL OR c.enddate > ? OR c.state=\
							'IN_FORCE')
							
TCONTRACTS_FIND_TERMINATED_BETWEEN = SELECT c.id, c.mechanic_id, c.startdate,\
 								   c.enddate, c.annualbasesalary, c.taxrate, \
 								   c.contracttype_id,c.professionalgroup_id, \
 								   c.settlement, c.version, c.entitystate, \
 								   c.createdat, c.updatedat, c.state FROM \
 								   TCONTRACTS c WHERE c.enddate IS NOT NULL \
 								   AND c.enddate 	>= ? AND c.enddate <= ?														   						 
TCONTRACTS_FIND_BY_CONTRACTTYPE = SELECT c.id, c.mechanic_id, c.startdate,\
 								   c.enddate, c.annualbasesalary, c.taxrate, \
 								   c.contracttype_id,c.professionalgroup_id, \
 								   c.settlement, c.version, c.entitystate, \
 								   c.createdat, c.updatedat, c.state FROM \
 								   TCONTRACTS c WHERE c.contracttype_id = ?
TCONTRACTS_FIND_CONTRACTED_MECHANIC = SELECT c.id, c.mechanic_id, c.startdate,\
 								   c.enddate, c.annualbasesalary, c.taxrate, \
 								   c.contracttype_id,c.professionalgroup_id, \
 								   c.settlement, c.version, c.entitystate, \
 								   c.createdat, c.updatedat, c.state FROM \
 								   TCONTRACTS c WHERE c.mechanic_id =?
 								   
 TCONTRACTS_FIND_CONTRACTED_MECHANICS = SELECT c.id, c.mechanic_id, c.startdate,\
 								   c.enddate, c.annualbasesalary, c.taxrate, \
 								   c.contracttype_id,c.professionalgroup_id, \
 								   c.settlement, c.version, c.entitystate, \
 								   c.createdat, c.updatedat, c.state FROM \
 								   TCONTRACTS c WHERE c.state = 'IN_FORCE' 															   						   
 								   
 # TCONTRACTSTYPE
TCONTRACTSTYPE_INSERT = INSERT INTO TCONTRACTTYPES(id, version, createdat, \
						updatedat, entitystate, compensationdaysperyear, name) \
						VALUES ( ?, ?, ?, ?, ?, ?, ?)
						
TCONTRACTSTYPE_UPDATE = UPDATE TCONTRACTTYPES set compensationdaysperyear=?, \
						entitystate=?,version=?,updatedat =? where id = ? 						
						
TCONTRACTSTYPE_DELETE = DELETE FROM TCONTRACTTYPES WHERE name = ?

TCONTRACTSTYPE_FIND_BY_ID = SELECT id,version,createdat,updatedat, \
							entitystate, compensationdaysperyear, name \
							FROM TCONTRACTTYPES WHERE id = ?
TCONTRACTSTYPE_FIND_BY_NAME = SELECT id,version,createdat,updatedat, \
							entitystate, compensationdaysperyear, name \
							FROM TCONTRACTTYPES WHERE name = ?
							
TCONTRACTSTYPE_FIND_ALL =SELECT id,version,createdat,updatedat, \
						 entitystate, compensationdaysperyear, name \
						 FROM TCONTRACTSTYPES